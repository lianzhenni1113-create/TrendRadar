# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                      Version: 2.0.0
#                      业务聚焦：艾尔兴舆情监控版
# ═══════════════════════════════════════════════════════════════

app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "always_on"             # 改为全天候模式，有舆情立即推送

platforms:
  enabled: true
  sources:
  - id: "toutiao"
    name: "今日头条"
  - id: "baidu"
    name: "百度热搜"
  - id: "thepaper"
    name: "澎湃新闻"
  - id: "ifeng"
    name: "凤凰网"
  - id: "cankaoxiaoxi"
    name: "参考消息"
  - id: "zaobao"
    name: "联合早报"
  - id: "weibo"
    name: "微博"
  - id: "douyin"
    name: "抖音"
  - id: "zhihu"
    name: "知乎"

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1               # 舆情监控只需看 1 天内的新文章
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
      enabled: false              # 默认禁用无关 RSS

report:
  mode: "incremental"             # 核心修改：增量模式，仅推送新增匹配
  display_mode: "keyword"
  sort_by_position_first: true    # 按你 TXT 文件里的顺序排（负面优先）
  rank_threshold: 5
  max_news_per_keyword: 0         # 以 TXT 里的 @数字 为准

display:
  region_order:
    - hotlist                     # 关键词匹配的舆情放在最前
    - ai_analysis                 # AI 分析紧随其后
    - rss
  regions:
    hotlist: true
    new_items: false              # 增量模式下无需额外的新增区域
    rss: true
    standalone: false             # 禁用独立展示区，保持内容纯净
    ai_analysis: true

notification:
  enabled: true
  channels:
    feishu:
      # 已配置你提供的飞书 Webhook
      webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/53a84adc-f279-4b64-a389-6aa050f19e19"

storage:
  backend: "auto"
  formats:
    sqlite: true
    html: true
  local:
    data_dir: "output"
    retention_days: 7             # 数据保留 7 天即可

ai:
  # 建议使用 DeepSeek 或 Gemini 提高分析质量
  model: "deepseek/deepseek-chat"
  api_key: "这里填写你的AI_API_KEY" 
  timeout: 120

ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "incremental"             # AI 也只分析新增舆情，节省成本
  max_news_for_analysis: 50
  include_rss: true
  include_standalone: false
  include_rank_timeline: true

advanced:
  debug: false
  crawler:
    request_interval: 5000        # 延长抓取间隔，降低被封 IP 风险
