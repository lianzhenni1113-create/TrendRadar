app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "always_on"

platforms:
  enabled: true
  sources:
  - id: "toutiao"
    name: "今日头条"
  - id: "baidu"
    name: "百度热搜"
  - id: "thepaper"
    name: "澎湃新闻"
  - id: "ifeng"
    name: "凤凰网"
  - id: "cankaoxiaoxi"
    name: "参考消息"
  - id: "zaobao"
    name: "联合早报"
  - id: "weibo"
    name: "微博"
  - id: "douyin"
    name: "抖音"
  - id: "zhihu"
    name: "知乎"

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds: []

report:
  mode: "incremental"
  display_mode: "keyword"
  sort_by_position_first: true
  rank_threshold: 5
  max_news_per_keyword: 0

display:
  region_order:
    - hotlist
    - ai_analysis
    - rss
  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true

notification:
  enabled: true
  channels:
    feishu:
      webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/53a84adc-f279-4b64-a389-6aa050f19e19"

storage:
  backend: "local"
  formats:
    sqlite: true
    html: true
  local:
    data_dir: "output"
    retention_days: 7

ai:
  model: "deepseek/deepseek-chat"
  api_key: "sk-5a41557155e94629a8192b5c28146b68"
  timeout: 120

ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "incremental"
  max_news_for_analysis: 50
  include_rss: true
  include_standalone: false
  include_rank_timeline: true

advanced:
  debug: false
  crawler:
    request_interval: 5000
